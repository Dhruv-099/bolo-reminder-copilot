# Bolo demo stack: build the image, serve on :8000, keep voice audio in a volume.
# .env is passed through but never baked into the image.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    volumes:
      - media:/app/media_root

volumes:
  media:
