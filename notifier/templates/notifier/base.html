<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bolo{% endblock %} · multilingual voice reminders</title>
    <style>
        :root {
            --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
            --bg: #f6f7f9; --card: #ffffff;
            --green: #15803d; --green-bg: #f0fdf4;
            --red: #b91c1c; --red-bg: #fef2f2;
            --amber: #b45309; --amber-bg: #fffbeb;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
        header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
        .brand span { color: var(--muted); font-weight: 400; }
        nav a { margin-left: 18px; color: var(--muted); text-decoration: none; font-size: 14px; }
        nav a:hover { color: var(--ink); }
        main { max-width: 1240px; margin: 0 auto; padding: 24px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .pill.due { background: var(--amber-bg); color: var(--amber); }
        .pill.sent { background: var(--green-bg); color: var(--green); }
        .pill.scheduled { background: #f3f4f6; color: #4b5563; }
        .pill.confirmed { background: var(--green-bg); color: var(--green); }
        .pill.declined { background: var(--red-bg); color: var(--red); }
        .pill.pending { background: #f3f4f6; color: #4b5563; }
        .pill.cancelled { background: #f3f4f6; color: #6b7280; }
        .btn { display: inline-block; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn:hover { opacity: 0.88; }
        .btn.ghost { background: transparent; color: var(--ink); }
        .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
        .btn.green { background: var(--green); border-color: var(--green); }
        audio { height: 34px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid var(--line); }
        td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
        tr.dim td { color: var(--muted); background: #fafafa; }
        .muted { color: var(--muted); }
        .msgs { list-style: none; margin: 0 0 20px; padding: 0; }
        .msgs li { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
        .msgs li.success { background: var(--green-bg); color: var(--green); border: 1px solid #bbf7d0; }
        .msgs li.error { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
        .msgs li.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .msgs li.warning { background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; }
        .statgrid { display: flex; gap: 12px; flex-wrap: wrap; }
        .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; min-width: 130px; }
        .stat b { display: block; font-size: 22px; }
        .stat span { font-size: 12px; color: var(--muted); }
        code { background: #f4f4f4; padding: 2px 4px; border-radius: 3px; font-size: 0.9em; }
    </style>
</head>
<body>
<header>
    <a class="brand" href="{% url 'notifier:dashboard' %}">bolo <span>· multilingual voice reminders</span></a>
    <nav>
        <a href="{% url 'notifier:dashboard' %}">Dashboard</a>
        <a href="{% url 'notifier:analytics' %}">Analytics</a>
        <a href="{% url 'admin:index' %}">Admin</a>
    </nav>
</header>
<main>
{% if messages %}
<ul class="msgs">
    {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
</ul>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
